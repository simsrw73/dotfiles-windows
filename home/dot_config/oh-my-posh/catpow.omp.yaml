blocks:
    - type: prompt
      alignment: left
      segments:
        - properties:
            cache_duration: none
          template: ' {{ if .Root }}<p:Yellow></>{{ else }}{{ if .WSL }}WSL at {{ end }}{{.Icon}}{{ end }} <p:Overlay0></>'
          foreground: p:Sapphire
          background: p:Crust
          type: os
          style: plain
        - properties:
            cache_duration: none
            style: full
          template: ' {{ .Path }} '
          foreground: p:Sapphire
          background: p:Crust
          type: path
          style: plain
        - properties:
            cache_duration: none
            fetch_stash_count: true
            fetch_status: true
            fetch_working_count: true
          foreground: p:Green
          background: p:Crust
          type: git
          style: plain
          templates:
            - '<p:Overlay0></> {{ .HEAD }} '
            - '{{ if .BranchStatus }}<p:Green>{{ .BranchStatus }}</> {{ end }}'
            - '{{ if .Staging.Changed }}<p:Yellow>+{{ add .Staging.Deleted .Staging.Added .Staging.Modified }}</> {{ end }}'
            - '{{ if add .Working.Deleted .Working.Modified }}<p:Yellow>!{{ add .Working.Deleted .Working.Modified }}</> {{ end }}'
            - '{{ if .Working.Added }}<p:Sky>?{{ .Working.Added }}</>{{ end }} '
            - '{{ if gt .StashCount 0 }}<p:Maroon>*{{ .StashCount }}</>{{ end }} '
            - '{{ if gt .WorktreeCount 0 }}<p:Maroon>{{ .WorktreeCount }}</> {{ end }}'
        - properties:
            cache_duration: none
          template: 
          foreground: p:Crust
          background: transparent
          type: text
          style: plain
      newline: true
    - type: prompt
      alignment: right
      segments:
        - properties:
            cache_duration: none
          leading_diamond: 
          template: ' {{ .UserName }}@{{ .HostName }} <p:Overlay0></>'
          foreground: p:Yellow
          background: p:Crust
          type: session
          style: diamond
        - properties:
            cache_duration: none
            time_format: "15:04:05"
          template: ' {{ .CurrentDate | date .Format }}   '
          foreground: p:Teal
          background: p:Crust
          type: time
          style: plain
    - type: prompt
      alignment: left
      segments:
        - properties:
            always_enabled: true
            cache_duration: none
          template: '❯ '
          foreground: p:Green
          type: exit
          style: plain
          foreground_templates:
            - '{{ if gt .Code 0 }}p:Red{{ end }}'
      newline: true
version: 3
