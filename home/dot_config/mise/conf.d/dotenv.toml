# Loads .env files as you change folders: the one in the current folder and each
# parent's (the nearest wins). Seeded by DotForge's mise plugin; edit freely,
# DotForge never overwrites it. config.toml (mise use --global) overrides it.
[settings]
env_file = ".env"

# Every project config file (.env, mise.toml, .tool-versions) loads only once you
# approve its current contents (`mise trust`); editing it revokes that. Until then
# mise warns "not trusted" and skips it.
#
# No trusted_config_paths: it would trust every mise.toml under a folder too, and
# a mise.toml can run commands (hooks, exec() templates), so a cloned repo would
# run its code on cd. Trust each folder once with `mise trust` instead.
paranoid = true
