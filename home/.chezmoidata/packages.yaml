  # cargo install (needs Rustlang.Rustup from winget). git: installs from a repo.
  cargo:
    - crate: choose
    - crate: rustscan
    - crate: sd
    - crate: wpmd
      git: https://github.com/LGUG2Z/wpm
    - crate: wpmctl
      git: https://github.com/LGUG2Z/wpm

  # rustup components (rustup itself from winget).
  rustup:
    components:
      - rust-analyzer

  # Node via fnm (Schniz.fnm from winget); first version becomes the default.
  node:
    versions:
      - lts-latest
    npm:
      - "@google/gemini-cli"
      - "@microsoft/inshellisense"
      - "@openai/codex"
      - "@vtsls/language-server"
      - gtop
      - neovim
      - prettier
      - tsx
      - vscode-langservers-extracted
      - yaml-language-server

  # Python via the Python install manager (Python.PythonInstallManager from winget).
  python:
    - "3.14"   # Neovim: LLVM's lldb-dap embeds Python 3.14 (linked/nvim/lua/config/tools.lua)

  # pipx from scoop; uv from winget (astral-sh.uv).
  pipx:
    - beets
    - glances
    - rich-cli
  uvtools:
    - basedpyright
    - pls
    - pynvim
