# Junctions made by run_onchange_after_10-links.ps1.
# Tokens: ~/ = home, {docs} = .documents, {src} = chezmoi working tree, %VAR% = env var.
links:
  - path: "~/.config/AutoHotKey"
    target: "{src}/linked/AutoHotKey"
  - path: "~/.config/FlowLauncher"
    target: "{src}/linked/FlowLauncher"
  - path: "~/.config/yasb"
    target: "{src}/linked/yasb"
  - path: "~/.config/komorebi"
    target: "{src}/linked/komorebi"
  - path: "~/.config/wpm"
    target: "{src}/linked/wpm"
  - path: "~/.config/claude"
    target: "{src}/linked/claude"
  - path: "~/.config/psmux"
    target: "{src}/linked/psmux"
  - path: "~/.config/yazi"
    target: "{src}/linked/yazi"
  - path: "~/.config/nvim"
    target: "{src}/linked/nvim"
  - path: "~/.config/powershell"
    target: "{src}/linked/powershell"
  - path: "%APPDATA%/FlowLauncher"
    target: "~/.config/FlowLauncher"
  - path: "~/{docs}/AutoHotkey"
    target: "~/.config/AutoHotKey"
  - path: "%APPDATA%/Zed"
    target: "~/.config/zed"
  - path: "%LOCALAPPDATA%/Zed"
    target: "~/.local/share/zed"
  - path: "~/{docs}/PowerShell/Modules/DotForge"
    target: "~/projects/DotForge"
